{% extends 'base.html' %}

{% block title %}Password Changed — EventHive{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success display-1"></i>
            </div>
            <h2 class="fw-bold">Password Reset Complete</h2>
            <p class="text-muted my-3">
                Success! Your new security credentials are live. You can now securely log back into EventHive.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary px-4 mt-2">Log In Now</a>
        </div>
    </div>
</div>
{% endblock %}
