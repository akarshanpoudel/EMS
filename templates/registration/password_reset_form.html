{% extends 'base.html' %}

{% block title %}Reset Password — EventHive{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 p-4">
                <h3 class="fw-bold text-center mb-3">Forgot Password?</h3>
                <p class="text-muted text-center small mb-4">
                    Enter the email address you registered with, and we'll send you a secure link to create a new password.
                </p>
                <form method="POST" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label small fw-semibold">Email Address</label>
                        <input type="email" name="email" id="id_email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Send Reset Link</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
